[package]
name = "supra_indexer_sdk"
description = "SDK for interacting with Supra blockchain indexer"
version = "0.1.0"
authors = ["mrathod05 <mrathod05@github>"]
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/mrathod05/supra_indexer_sdk"
documentation = "https://docs.rs/supra_indexer_sdk"
keywords = ["supra", "blockchain", "indexer", "sdk"]
categories = ["cryptography::cryptocurrencies", "database", "web-programming", "rust-patterns"]
rust-version = "1.85.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256
rpath = false

[profile.release]
opt-level = 3
debug = 2
debug-assertions = false
overflow-checks = false
lto = "thin"
panic = 'abort'
codegen-units = 16
incremental = true
rpath = false

[dependencies]
tokio = { version = "1.0", features = ["full"] }
diesel = { version = "2.0", features = ["postgres", "r2d2", "chrono", "serde_json"] }
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
async-trait = "0.1"
anyhow = "1.0.100"
tracing = "0.1"
