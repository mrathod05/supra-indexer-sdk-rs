[package]
name = "supra_indexer_sdk"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Build crash-safe Supra blockchain event indexers backed by PostgreSQL (diesel)."
readme = "README.md"
authors = ["Meet Rathod <mrathod05@github>"]
homepage = "https://meetrathoddeveloper.netlify.app/"
documentation = "https://docs.rs/supra_indexer_sdk"
keywords = ["supra", "blockchain", "indexer", "sdk", "web3"]
categories = ["cryptography::cryptocurrencies", "database", "web-programming"]

[features]
default = []
# Health / readiness / admin HTTP server (axum).
server = ["dep:axum", "dep:subtle"]

[dependencies]
anyhow = "1.0.100"
diesel = { version = "2.3", features = ["postgres", "r2d2"] }
bytes = "1"
fastrand = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.128"
thiserror = "2.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tokio-util = "0.7"
tracing = "0.1"
url = "2.5"

axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "tokio", "json"] }
subtle = { version = "2.6", optional = true }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1.48", features = ["full"] }
wiremock = "0.6"

[package.metadata.docs.rs]
all-features = true
